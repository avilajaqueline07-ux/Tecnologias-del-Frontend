<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro al HTML</title>
    <style>
        #div1 {
            border: 3px;
            border-color: red;
            border-style: dashed;

            /* Las reglas de estilo anteriores se pueden resumir en la 
            siguiente: border: 3px dashed red */
            margin-bottom: 4px;
        }

        #div2 {
            border-top: 3px;
            border-right: 6px;
            border-bottom: 3px;
            border-left: 6px;
            border-color: green;
            border-style: dotted;
        }

    </style>
</head>
<body>
    <h1>Box Model (Modelo de Caja)</h1>

    <div id="div1">
        Caja # 1
    </div>

    <div id="div2">
        Caja # 2
    </div>
 
   
</body>
</html>
