<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro al HTML</title>
    <style>

        /* Cuando el link (enlace) no ha sido visitado todavia */
        a:link {
            color: red;
        }

        /* Cuando el link ha sido visitado */
        a:visited {
            color: green;
        }

        /* Cuando el raton esta encima del link, sin hacer click en el mismo */
        a:hover {
            color: hotpink;
        }

        /* Cuando el link ha sido seleccionado, cuando esta activo, es decir
        cuando hacemos click y mantenemos el click presionado sobre el link */
        a:active {
            color: blue;
        }
    </style>
</head>
<body>
    <!-- Las PSeudoclases: Son selectores que se aplican en dependencia del 
     estado del elemento -->

    <h1>Aplicar estilo a un enlace en dependencia del estado del mismo</h1>
    
    <p><a href="https://www.vodafone.es/c/particulares/es/" target="_blank">Vodafone</a></p>

    <p><strong>Nota: </strong>a:hover tiene que ir despues de a:link y a:visited en las reglas de estilo para que sean efectivas. Y ademas,
    la pseudoclase a:active tiene que ir despues de a:hover.</p>

</body>
</html>
